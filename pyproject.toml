[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-goal-world-model"
version = "0.1.0"
description = "Goal-conditioned nine-stage world model with pooled or patch temporal attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
